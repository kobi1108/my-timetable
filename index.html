<section id="hero" class="hero"><div><div id="hero-state" class="eyebrow"></div><h2 id="hero-course"></h2><p id="hero-room"></p><p id="hero-time"></p><p id="conditional" class="conditional"></p></div><div class="countdown"><small id="count-label"></small><strong id="count"></strong><progress id="progress" max="100" value="0"></progress><div id="progress-label"></div></div></section>

<section class="schedule"><div class="toolbar"><div><h2 id="range"></h2></div><div class="controls"><div class="segmented" aria-label="檢視方式"><button data-view="day">Day</button><button data-view="week">Week</button></div><div class="nav"><button id="prev" aria-label="前一段日期">‹</button><button id="today">今天</button><button id="next" aria-label="後一段日期">›</button></div></div></div><div class="subtoolbar"><span class="attendance-legend"><span><i class="required"></i>要返</span><span><i class="optional"></i>唔一定要返</span></span><label><input id="hide-weekends" type="checkbox"> 隱藏週末</label></div><div id="surface"></div></section><footer>依常規每週課表計算；未套用學期起訖、假期及停課。實驗課／PALSI 請確認實際週次。</footer></main>
<dialog id="detail" aria-labelledby="detail-title"><form method="dialog"><button class="close" aria-label="關閉">×</button></form><div class="handle" aria-label="向下滑動關閉詳情"></div><span id="detail-kind" class="eyebrow"></span><h2 id="detail-title"></h2><div id="detail-body"></div><div class="detail-actions"><a id="map" target="_blank" rel="noopener">搜尋課室建築位置 ↗</a><a id="calendar" target="_blank" rel="noopener">加入 Calendar ↗</a></div><details><summary>課程資料</summary><p id="course-info"></p></details><small>日曆僅加入所選日期這一堂，不會建立每週重複課程。</small></dialog><script>const courses=[
{id:'palsi-ma2001',day:1,start:540,end:655,code:'MA2001',section:'',kind:'palsi',attendance:'optional',room:'地點未知',startDate:'2026-09-21',endDate:'2026-11-16'},
{id:'11370',day:1,start:720,end:890,code:'EE3114',section:'L01',kind:'lab',attendance:'optional',room:'YEUNG P1404、YEUNG G7610、YEUNG B7701'},
{id:'13332',day:1,start:900,end:1070,code:'EE2108',section:'CA1',kind:'lecture',attendance:'required',room:'YEUNG B7701'},
{id:'11369',day:3,start:720,end:890,code:'EE3114',section:'C01',kind:'lecture',attendance:'required',room:'YEUNG LT-16'},
{id:'13334',day:4,start:540,end:650,code:'EE2108',section:'LA1',kind:'lab',attendance:'optional',room:'YEUNG B7701'},
{id:'10030',day:4,start:960,end:1130,code:'EE3210',section:'C01',kind:'lecture',attendance:'required',room:'LI 6606'},
{id:'10426',day:5,start:720,end:830,code:'MA2001',section:'CA1',kind:'lecture',attendance:'required',room:'BOC R4057'}];
const $=id=>document.getElementById(id), names=['週日','週一','週二','週三','週四','週五','週六'];
const status={required:'要返',optional:'唔一定要返'}; const shortStatus=status; const typeLabel={lecture:'LECTURE',lab:'實驗課',palsi:'PALSI'}; const mobile=matchMedia('(max-width:767px)');
const fmt24=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0');
const fmt12=n=>`${Math.floor(n/60)%12||12}:${String(Math.floor(n%60)).padStart(2,'0')} ${Math.floor(n/60)<12?'AM':'PM'}`; const fmt=n=>mobile.matches?fmt12(n):fmt24(n);
function hkNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Hong_Kong'}));}
const midnight=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);const same=(a,b)=>a.toDateString()===b.toDateString();const md=d=>`${d.getMonth()+1}月${d.getDate()}日`;const mins=d=>d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function scheduled(c,d){const key=dateKey(d);return c.day===d.getDay()&&(!c.startDate||key>=c.startDate)&&(!c.endDate||key<=c.endDate)}
function occurrence(c,base=hkNow(),includeCurrent=false){let d=add(base,(c.day-base.getDay()+7)%7);if(same(d,base)&&(includeCurrent?c.end:c.start)<=mins(base))d=add(d,7);if(c.startDate&&dateKey(d)<c.startDate){d=parseDate(c.startDate);d=add(d,(c.day-d.getDay()+7)%7)}return scheduled(c,d)?d:null;}
function duration(n){n=Math.max(0,Math.ceil(n));return (n>=1440?Math.floor(n/1440)+' 天 ':'')+(n%1440>=60?Math.floor(n%1440/60)+' 小時 ':'')+(n%60)+' 分';}
let now=hkNow(),focus=midnight(now),view=mobile.matches?'day':'week',last='',opened=null;
function compactRoom(c){const rooms=c.room.split('、');return rooms.length>1?'多課室':rooms[0].replace(/^(YEUNG|BOC|LI)\s+/, '');}
function card(c,d,positioned=false){const b=document.createElement('button');const live=same(d,now)&&mins(now)>=c.start&&mins(now)<c.end;b.className='course '+c.kind+' attendance-'+c.attendance+(live?' live':'')+(c.end-c.start<60?' short':'');if(positioned){b.style.top=((c.start-480)*(mobile.matches?.6:1.8))+'px';b.style.height=((c.end-c.start)*(mobile.matches?.6:1.8)-(mobile.matches?1:5))+'px';}b.innerHTML=`<div class="card-top"><strong>${c.code}</strong><span class="card-time">${fmt(c.start)}–${fmt(c.end)}</span></div><div class="card-meta"><span class="badge ${c.kind}">${typeLabel[c.kind]}</span>${positioned?'':'<span>'+c.section+'</span>'}</div><span class="attendance">${status[c.attendance]}${live&&c.attendance==='required'?' · LIVE':''}</span><span class="room">⌖ ${c.room}</span>`;if(positioned&&mobile.matches){b.innerHTML=`<strong class="mini-code">${c.code}</strong><span class="badge mini-type ${c.kind}">${typeLabel[c.kind]}</span><span class="mini-location">${compactRoom(c)}</span><span class="mini-status">${shortStatus[c.attendance]}</span>`;if(c.end-c.start<60)b.innerHTML=`<strong class="mini-code">${c.code}</strong><span class="mini-short"><span class="badge mini-type ${c.kind}">${typeLabel[c.kind]}</span> ${shortStatus[c.attendance]}</span>`;}b.setAttribute('aria-label',`${c.code} ${c.section} ${fmt(c.start)} 至 ${fmt(c.end)} ${status[c.attendance]} ${c.room}`);b.onclick=()=>openDetail(c,d);return b;}
function openDetail(c,d){opened={c,d};$('detail-kind').textContent=typeLabel[c.kind]+(c.section?' · '+c.section:'');$('detail-title').textContent=c.code;const next=occurrence(c);const currentDate=hkNow();const activeNow=same(d,currentDate)&&c.start<=mins(currentDate)&&mins(currentDate)<c.end;const upcoming=courses.filter(x=>x.attendance==='required').map(x=>({c:x,d:occurrence(x,currentDate)})).filter(x=>x.d).sort((a,b)=>a.d-b.d||a.c.start-b.c.start)[0];const nextNow=upcoming&&upcoming.c===c&&same(d,upcoming.d);$('detail-body').innerHTML=`<p class="detail-state">${activeNow?(c.attendance==='required'?'LIVE · 正在上課':'目前排課時段 · '+status[c.attendance]):nextNow?'下一堂要返':'所選課堂'}</p><p>${md(d)} ${names[d.getDay()]} · ${fmt(c.start)}–${fmt(c.end)}</p><p>⌖ ${c.room}</p><div class="info-row"><small>出席安排</small><strong>${status[c.attendance]}</strong></div><div class="info-row"><small>下一次常規時段</small><strong>${next?md(next)+' · '+fmt(c.start):'此課程已結束'}</strong></div>${c.kind==='palsi'?'<p class="notice">2026/9/21–11/16，每週一；地點未公布。</p>':c.attendance!=='required'?'<p class="notice">請以課程通知確認是否需要出席。</p>':''}`;const building=c.room.startsWith('YEUNG')?'Yeung Kin Man Academic Building City University Hong Kong':c.room.startsWith('BOC')?'Bank of China Hong Kong Complex City University Hong Kong':'Li Dak Sum Yip Yio Chin Academic Building City University Hong Kong';$('map').hidden=c.room==='地點未知';$('map').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(building);const stamp=m=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${fmt24(m).replace(':','')}00`;$('calendar').href='https://calendar.google.com/calendar/render?'+new URLSearchParams({action:'TEMPLATE',text:c.code+(c.section?' · '+c.section:''),dates:stamp(c.start)+'/'+stamp(c.end),ctz:'Asia/Hong_Kong',location:c.room,details:status[c.attendance]+'。依常規課表；請確認假期、停課及實際週次。'});$('course-info').textContent=`課程：${c.code}　組別：${c.section||'未提供'}　CRN：${c.kind==='palsi'?'未提供':c.id}。目前未提供課程大綱連結。`;$('detail').showModal();}
function dates(){if(view==='day')return[focus];const mon=add(focus,-((focus.getDay()+6)%7));return Array.from({length:mobile.matches||$('hide-weekends').checked?5:7},(_,i)=>add(mon,i));}
function render(){const ds=dates(); const scale=mobile.matches?.6:1.8; $('today').textContent=view==='week'?'本週':'今天';$('range').textContent=view==='day'?`${md(focus)} · ${names[focus.getDay()]}`:`${md(ds[0])} — ${md(ds.at(-1))}`;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));$('hide-weekends').disabled=view!=='week';const surface=$('surface');surface.className=view==='day'?'daily':'grid-scroll';surface.replaceChildren();if(view==='day'){const list=courses.filter(c=>scheduled(c,focus));if(!list.length)surface.innerHTML='<div class="empty">這天沒有排課 ☁<small>留一點時間給自己。</small></div>';list.forEach(c=>{const row=document.createElement('div');row.className='daily-row';row.innerHTML=`<time>${fmt(c.start)}</time>`;row.append(card(c,focus));surface.append(row)});return;}const grid=document.createElement('div');grid.className='grid '+view;grid.style.gridTemplateColumns=mobile.matches?'30px repeat(5,minmax(0,1fr))':'52px '+ds.map(d=>d.getDay()===0||d.getDay()===6?'minmax(82px,.55fr)':'minmax(150px,1fr)').join(' ');grid.append(document.createElement('div'));ds.forEach(d=>{const h=document.createElement('div');h.className='day-head'+(same(d,now)?' today':'')+(d.getDay()%6===0?' weekend':'');h.innerHTML=`${mobile.matches?['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]:names[d.getDay()]} <small>${mobile.matches?d.getDate():(d.getMonth()+1)+'/'+d.getDate()}</small>${same(d,now)?'<b aria-label="今天">●</b>':''}`;grid.append(h)});const times=document.createElement('div');times.className='time-lane';for(let m=480;m<=1140;m+=60){const t=document.createElement('time');t.style.top=((m-480)*scale)+'px';t.innerHTML=mobile.matches?`${Math.floor(m/60)%12||12} <small>${m<720?'AM':'PM'}</small>`:fmt(m);times.append(t)}if(ds.some(x=>same(x,now))&&mins(now)>=480&&mins(now)<=1140){const label=document.createElement('div');label.className='now-axis-label';label.style.top=((mins(now)-480)*scale)+'px';label.innerHTML=mobile.matches?fmt12(mins(now)).replace(' ','<small>')+'</small>':fmt(mins(now));label.setAttribute('aria-label','目前時間 '+fmt(mins(now)));times.append(label)}grid.append(times);ds.forEach(d=>{const lane=document.createElement('div');lane.className='day-lane'+(same(d,now)?' today':'')+(d.getDay()%6===0?' weekend':'');courses.filter(c=>scheduled(c,d)).forEach(c=>lane.append(card(c,d,true)));if(ds.some(x=>same(x,now))&&mins(now)>=480&&mins(now)<=1140){const line=document.createElement('div');line.className='now-line';line.style.top=((mins(now)-480)*scale)+'px';lane.append(line)}grid.append(lane)});surface.append(grid);if(mobile.matches&&!$('hide-weekends').checked){const section=document.createElement('section');section.className='weekend-agenda';section.innerHTML='<h3>週末</h3>';const mon=add(focus,-((focus.getDay()+6)%7));for(const n of [5,6]){const d=add(mon,n),list=courses.filter(c=>scheduled(c,d));const heading=document.createElement('p');heading.textContent=md(d)+' '+names[d.getDay()]+(list.length?'':' · 沒有課堂');section.append(heading);list.forEach(c=>section.append(card(c,d)));}surface.append(section);}}
function tick(){now=hkNow();const m=mins(now),list=courses.filter(c=>scheduled(c,now)),current=list.find(c=>c.attendance==='required'&&m>=c.start&&m<c.end),conditional=list.find(c=>c.attendance!=='required'&&m>=c.start&&m<c.end);const next=courses.filter(c=>c.attendance==='required').map(c=>{const d=occurrence(c);const dayDiff=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);return{c,d,left:dayDiff*1440+c.start-m}}).sort((a,b)=>a.left-b.left)[0];const c=current||next.c;$('clock').textContent=fmt(m)+(mobile.matches?'':':'+String(now.getSeconds()).padStart(2,'0'));$('date').textContent=md(now)+' '+names[now.getDay()];$('hero-state').textContent=current?'● LIVE · 正在上課':next.left<=15?'即將上課 · 準備出發':'NEXT · 下一堂';$('hero-course').textContent=c.code;$('hero-room').textContent='⌖ '+c.room;$('hero-time').textContent=current?`上到 ${fmt(c.end)}`:`${same(next.d,now)?'':md(next.d)+' '}${fmt(c.start)} 開始`;$('count-label').textContent=current?'距離下課':'距離上課';$('count').textContent=(mobile.matches&&current?'還有 ':'')+duration(current?c.end-m:next.left)+(mobile.matches?(current?' 下課':'後上課'):'');const pct=current?(m-c.start)/(c.end-c.start)*100:Math.max(0,(1-next.left/180)*100);$('progress').value=pct;$('progress').hidden=!current;$('progress-label').hidden=!current;$('progress-label').textContent=current?`已完成 ${Math.floor(pct)}%`:'上課前 3 小時倒數進度';$('hero').className='hero '+(current?'live':next.left<=15?'soon':next.left<60?'near':'');$('conditional').textContent=conditional?`此時段另有 ${conditional.code} · ${status[conditional.attendance]}`:'';const key=now.toDateString()+Math.floor(m);if(key!==last){last=key;render()}}
$('prev').onclick=()=>{focus=add(focus,view==='week'?-7:-1);render()};$('next').onclick=()=>{focus=add(focus,view==='week'?7:1);render()};$('today').onclick=()=>{focus=midnight(hkNow());render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('hide-weekends').onchange=render;$('detail').onclick=e=>{if(e.target===$('detail'))$('detail').close()};tick();setInterval(tick,1000);

$('hide-weekends').checked=mobile.matches; mobile.addEventListener('change',()=>{if(mobile.matches)$('hide-weekends').checked=true;last='';tick();});
let swipeStart=null;const sheet=$('detail');sheet.addEventListener('touchstart',e=>{const t=e.touches[0],r=sheet.getBoundingClientRect();swipeStart=t.clientY-r.top<90?{x:t.clientX,y:t.clientY}:null;},{passive:true});sheet.addEventListener('touchend',e=>{if(swipeStart&&mobile.matches){const t=e.changedTouches[0];if(t.clientY-swipeStart.y>65&&Math.abs(t.clientX-swipeStart.x)<55)sheet.close();}swipeStart=null;},{passive:true});sheet.addEventListener('touchcancel',()=>swipeStart=null);render();
</script></body></html>
