<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2763cb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="藍色大學課表，香港時間與目前及下一堂課。"><title>我的課表 · Campus Blue</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#183458;background:#edf4fc;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}main{max-width:1440px;margin:auto;padding:38px 40px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px}header .eyebrow{color:#48749f}h1{font-size:34px;margin:6px 0 0;letter-spacing:-1px}.title-dot{color:#3788ea}h2,h3,p{margin:0}.clock-wrap{text-align:right;font-size:14px;color:#55708f}#clock{font-size:28px;letter-spacing:1px;color:#244b7a;font-variant-numeric:tabular-nums}.zone{margin-left:12px;font-size:12px}.live-panel{display:grid;grid-template-columns:1.25fr 1fr;background:#245fc5;color:white;border-radius:24px;margin-bottom:28px;padding:28px 32px;gap:32px}.live-panel .eyebrow{color:#d3e6ff}.live-main h2{font-size:27px;margin:12px 0 8px}.live-panel p{font-size:14px;line-height:1.8;color:#e0edff}.up-next{border-left:1px solid #ffffff40;padding-left:32px;align-content:center}.up-next h3{font-size:20px;margin:12px 0 6px}.schedule{background:#fff;border-radius:24px;padding:26px;box-shadow:0 8px 35px #1f508609}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.toolbar h2{font-size:20px}.toolbar p{font-size:14px;color:#657e9a;margin-top:7px}.week-actions{display:flex;gap:6px}.week-actions button{border:0;background:#edf4fd;color:#244e81;border-radius:12px;min-height:44px;padding:8px 16px}.week-actions button:hover{background:#d8e9fc}.legend{display:flex;gap:22px;margin:22px 0;font-size:13px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:7px}.legend i{width:10px;height:10px;border-radius:3px}.lecture-dot{background:#3074d3}.lab-dot{background:#b8d9fa}.ta-dot{background:#d7f0f8}.grid{display:grid;grid-template-columns:58px repeat(7,minmax(0,1fr));position:relative;gap:0 7px}.day-head{height:56px;text-align:center;background:#f0f6fd;border-radius:12px;margin-bottom:8px;padding:8px 0;font-size:14px}.day-head small{display:block;color:#70869e;margin-top:2px}.day-head.is-today{background:#245fc5;color:white}.day-head.is-today small{color:#dbe9ff}.time-lane,.day-lane{height:660px;position:relative}.day-lane{border-radius:12px;background:repeating-linear-gradient(to bottom,#f4f8fd 0,#f4f8fd 59px,#fff 59px,#fff 60px)}.time-label{position:absolute;font-size:12px;color:#6c809b;transform:translateY(-6px);font-variant-numeric:tabular-nums}.course{position:absolute;width:100%;text-align:left;overflow:hidden;border:0;border-radius:12px;background:#d6e7ff;color:#194b89;padding:12px 10px;display:flex;flex-direction:column;gap:6px;transition:filter .15s}.course:hover{filter:brightness(.97)}.course.lecture{background:#c9dfff;border-left:3px solid #3c7bcd}.course.lab{background:#e0edfd;border:1px dashed #86acd8}.course.ta{background:#e8f5fc;border:1px dashed #96c4da}.course strong{font-size:16px}.course .section{font-size:12px;font-weight:600}.course .room{font-size:13px;line-height:1.45}.course .time{font-size:12px}.course.current{background:#2865c8;color:white;box-shadow:0 5px 16px #245fc52b}.course.ta{gap:2px;padding:7px 10px}.now-line{position:absolute;left:0;right:0;height:2px;background:#f17359;z-index:2;pointer-events:none}.now-line:before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#f17359}.day-tabs,.agenda{display:none}footer{font-size:12px;line-height:1.7;color:#657b96;padding:20px 4px}dialog{border:0;border-radius:24px;padding:32px;max-width:430px;width:calc(100% - 32px);color:#183458;box-shadow:0 25px 100px #13305c33}dialog::backdrop{background:#16355a66}dialog h2{font-size:28px;margin:12px 0 20px}dialog p{margin:12px 0;line-height:1.7}dialog .eyebrow{color:#4679ac}.close{float:right;border:0;background:#edf4fc;color:#244e81;border-radius:50%;width:36px;height:36px;font-size:24px}button:focus-visible{outline:3px solid #ef975c;outline-offset:3px}@media(min-width:761px) and (max-width:1100px){main{padding:24px 18px}.schedule{padding:18px}.grid-scroll{overflow-x:auto}.grid{min-width:980px}}@media(max-width:760px){main{padding:24px 16px}header{align-items:flex-start;margin-bottom:22px}h1{font-size:29px}header .eyebrow{font-size:10px}.clock-wrap{font-size:12px}#clock{font-size:23px}.zone{display:block;margin:2px 0 0;font-size:11px}.live-panel{grid-template-columns:1fr;padding:24px;gap:20px;border-radius:22px;margin-bottom:22px}.live-main h2{font-size:25px}.up-next{padding:19px 0 0;border-left:0;border-top:1px solid #ffffff40}.up-next h3{font-size:18px}.schedule{padding:20px 16px}.toolbar h2{font-size:18px}.toolbar p{font-size:12px}.week-actions button{padding:8px 11px}.legend{gap:10px 16px;font-size:12px;margin:20px 0}.day-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:18px 0}.day-tabs button{min-height:54px;border:0;border-radius:12px;background:#f0f6fd;color:#486b90;font-size:12px;padding:6px 0}.day-tabs button small{display:block;margin-top:6px;font-size:13px}.day-tabs button.selected{background:#245fc5;color:white}.grid-scroll{display:none}.agenda{display:flex;flex-direction:column;gap:12px}.agenda .course{position:static;min-height:125px;padding:16px;gap:7px}.agenda .course strong{font-size:20px}.agenda .course .room{font-size:14px}.agenda .course .time{font-size:14px}.empty{padding:42px 10px;text-align:center;background:#f4f8fd;border-radius:16px;color:#6a829d}.empty strong{display:block;font-size:19px;color:#33577f;margin-bottom:8px}footer{padding-top:18px}}

@media(min-width:761px){.course.ta{padding:5px 7px;gap:2px}.course.ta .time,.course.ta .section{display:none}.course.ta strong{font-size:14px}.course.ta strong:after{content:" · TA2";font-size:12px}.course.ta .room{font-size:12px}}
</style></head>
<body><main><header><div><span class="eyebrow">CAMPUS BLUE</span><h1>我的課表<span class="title-dot">.</span></h1></div><div class="clock-wrap"><div id="date"></div><div><strong id="clock">--:--:--</strong><span class="zone">香港時間</span></div></div></header>
<section class="live-panel"><div class="live-main"><span class="eyebrow">RIGHT NOW · 現在</span><h2 id="current">正在讀取時間</h2><p id="current-detail"></p></div><div class="up-next"><span class="eyebrow">UP NEXT · 下一堂必修出席課</span><h3 id="next"></h3><p id="next-detail"></p></div></section>
<section class="schedule"><div class="toolbar"><div><h2>每週時間表</h2><p id="week-label"></p></div><div class="week-actions"><button id="prev" aria-label="上一週">‹</button><button id="today">本週</button><button id="forward" aria-label="下一週">›</button></div></div><div class="legend"><span><i class="lecture-dot"></i>Lecture · 必須出席</span><span><i class="lab-dot"></i>Lab · 需確認週次</span><span><i class="ta-dot"></i>TA · 按需要出席</span></div><div id="days" class="day-tabs" aria-label="選擇星期"></div><div class="grid-scroll"><div id="grid" class="grid"></div></div><div id="agenda" class="agenda"></div></section>
<footer>依你提供的課表建立 · 未套用學期起訖、假期及停課安排。Lab／TA 請以課程通知為準。</footer></main>
<dialog id="detail"><form method="dialog"><button class="close" aria-label="關閉">×</button></form><span id="detail-kind" class="eyebrow"></span><h2 id="detail-title"></h2><div id="detail-body"></div></dialog><script>const courses=[
{id:'11370',day:1,start:720,end:890,code:'EE3114',section:'L01',kind:'lab',room:'YEUNG P1404、YEUNG G7610、YEUNG B7701'},
{id:'13332',day:1,start:900,end:1070,code:'EE2108',section:'CA1',kind:'lecture',room:'YEUNG B7701'},
{id:'11696',day:2,start:900,end:950,code:'MA2001',section:'TA2',kind:'ta',room:'YEUNG LT-13'},
{id:'10426',day:2,start:1020,end:1130,code:'MA2001',section:'CA1',kind:'lecture',room:'YEUNG LT-1'},
{id:'11369',day:3,start:720,end:890,code:'EE3114',section:'C01',kind:'lecture',room:'YEUNG LT-16'},
{id:'13334',day:4,start:540,end:650,code:'EE2108',section:'LA1',kind:'lab',room:'YEUNG B7701'},
{id:'10030',day:4,start:960,end:1130,code:'EE3210',section:'C01',kind:'lecture',room:'LI 6606'},
{id:'10426',day:5,start:720,end:830,code:'MA2001',section:'CA1',kind:'lecture',room:'BOC R4057'}];
const names=['週日','週一','週二','週三','週四','週五','週六'];const kinds={lecture:'Lecture · 必須出席',lab:'Lab · 需確認週次',ta:'TA · 按需要出席'};
const $=id=>document.getElementById(id);const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function hkNow(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(v=>[v.type,v.value]));return new Date(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second));}
let now=hkNow(),offset=0,selected=now.getUTCDay(),lastKey='';
function monday(){const d=hkNow();d.setUTCHours(0,0,0,0);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)+offset*7);return d;}
function dateFor(day){const d=monday();d.setUTCDate(d.getUTCDate()+((day+6)%7));return d;}
const md=d=>(d.getUTCMonth()+1)+'/'+d.getUTCDate();
function active(c){return offset===0&&c.day===now.getUTCDay()&&now.getUTCHours()*60+now.getUTCMinutes()>=c.start&&now.getUTCHours()*60+now.getUTCMinutes()<c.end;}
function card(c,positioned){const b=document.createElement('button');b.className='course '+c.kind+(active(c)?' current':'');b.setAttribute('aria-label',`${c.code} ${c.section} ${fmt(c.start)} 至 ${fmt(c.end)} ${c.room} ${kinds[c.kind]}`);if(positioned){b.style.top=(c.start-480)+'px';b.style.height=(c.end-c.start)+'px';}b.innerHTML=`<span class="time">${fmt(c.start)}–${fmt(c.end)}</span><strong>${c.code}</strong><span class="section">${c.section} · ${c.kind==='lecture'?'Lecture':c.kind==='lab'?'Lab':'TA'}</span><span class="room">${c.room}</span>`;b.onclick=()=>{$('detail-kind').textContent=kinds[c.kind];$('detail-title').textContent=c.code+' · '+c.section;$('detail-body').replaceChildren();for(const text of [`${names[c.day]}　${fmt(c.start)}–${fmt(c.end)}`,c.room,`CRN：${c.id}`,c.kind==='lecture'?'Lecture 必須出席。此處顯示每週常規課表，請留意假期及停課通知。':c.kind==='lab'?'此 Lab 不一定每週上課；請確認課程通知中的週次與實際課室。':'此 TA 課按需要出席，請確認課程安排。']){const p=document.createElement('p');p.textContent=text;$('detail-body').append(p)}$('detail').showModal()};return b;}
function render(){const mon=monday(),sun=dateFor(0);$('week-label').textContent=`${mon.getUTCFullYear()} · ${md(mon)} — ${md(sun)}`;$('grid').replaceChildren();$('days').replaceChildren();$('grid').append(document.createElement('div'));for(const day of [1,2,3,4,5,6,0]){const h=document.createElement('div');h.className='day-head'+(offset===0&&day===now.getUTCDay()?' is-today':'');h.innerHTML=`${names[day]}<small>${md(dateFor(day))}</small>`;$('grid').append(h);const b=document.createElement('button');b.className=day===selected?'selected':'';b.setAttribute('aria-pressed',String(day===selected));b.innerHTML=`${names[day]}<small>${dateFor(day).getUTCDate()}</small>`;b.onclick=()=>{selected=day;render()};$('days').append(b)}const times=document.createElement('div');times.className='time-lane';for(let m=480;m<=1140;m+=60){const t=document.createElement('span');t.className='time-label';t.style.top=(m-480)+'px';t.textContent=fmt(m);times.append(t)}$('grid').append(times);for(const day of [1,2,3,4,5,6,0]){const lane=document.createElement('div');lane.className='day-lane';courses.filter(c=>c.day===day).forEach(c=>lane.append(card(c,true)));const min=now.getUTCHours()*60+now.getUTCMinutes();if(offset===0&&day===now.getUTCDay()&&min>=480&&min<=1140){const line=document.createElement('div');line.className='now-line';line.style.top=(min-480)+'px';line.setAttribute('aria-label','目前時間 '+fmt(min));lane.append(line)}$('grid').append(lane)}$('agenda').replaceChildren();const list=courses.filter(c=>c.day===selected);if(list.length)list.forEach(c=>$('agenda').append(card(c,false)));else $('agenda').innerHTML='<div class="empty"><strong>這天沒有排課</strong>留一點時間給自己。</div>';}
function tick(){now=hkNow();const min=now.getUTCHours()*60+now.getUTCMinutes(),day=now.getUTCDay();$('clock').textContent=fmt(min)+':'+String(now.getUTCSeconds()).padStart(2,'0');$('date').textContent=`${now.getUTCFullYear()}年${now.getUTCMonth()+1}月${now.getUTCDate()}日　${names[day]}`;const current=courses.find(c=>c.day===day&&min>=c.start&&min<c.end);$('current').textContent=current?(current.kind==='lecture'?'正在上課 · ':'此時段有待確認課程 · ')+current.code:'現在沒有必須出席的課';$('current-detail').textContent=current?`${current.section} · ${fmt(current.start)}–${fmt(current.end)} · ${current.room}${current.kind==='lecture'?'':' · '+kinds[current.kind]}`:'依每週常規課表顯示';const upcoming=courses.filter(c=>c.kind==='lecture').map(c=>{let delta=((c.day-day+7)%7)*1440+c.start-min;if(delta<=0)delta+=10080;return{c,delta}}).sort((a,b)=>a.delta-b.delta)[0];$('next').textContent=upcoming.c.code+' · '+upcoming.c.section;const left=upcoming.delta<60?`${upcoming.delta} 分鐘後`:upcoming.delta<1440?`${Math.floor(upcoming.delta/60)} 小時 ${upcoming.delta%60} 分鐘後`:`${Math.floor(upcoming.delta/1440)} 天後`;$('next-detail').textContent=`${names[upcoming.c.day]} ${fmt(upcoming.c.start)} · ${upcoming.c.room} · ${left}`;const key=now.getUTCDate()+':'+min;if(key!==lastKey){lastKey=key;render()}}
$('prev').onclick=()=>{offset--;render()};$('forward').onclick=()=>{offset++;render()};$('today').onclick=()=>{offset=0;selected=hkNow().getUTCDay();render()};$('detail').addEventListener('click',e=>{if(e.target===$('detail'))$('detail').close()});tick();setInterval(tick,1000);
</script></body></html>
