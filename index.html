function openDetail(c,d){opened={c,d};$('detail-kind').textContent=c.kind.toUpperCase();$('detail-title').textContent=c.code+' · '+c.section;const next=occurrence(c);$('detail-body').innerHTML=`<p>${md(d)} ${names[d.getDay()]} · ${fmt(c.start)}–${fmt(c.end)}</p><p>⌖ ${c.room}</p><div class="info-row"><small>出席安排</small><strong>${status[c.attendance]}</strong></div><div class="info-row"><small>下一次常規時段</small><strong>${md(next)} · ${fmt(c.start)}</strong></div>${c.attendance!=='required'?'<p class="notice">此時段未確認實際上課週次，請先查看課程通知。</p>':''}`;const building=c.room.startsWith('YEUNG')?'Yeung Kin Man Academic Building City University Hong Kong':c.room.startsWith('BOC')?'Bank of China Hong Kong Complex City University Hong Kong':'Li Dak Sum Yip Yio Chin Academic Building City University Hong Kong';$('map').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(building);const stamp=m=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${fmt(m).replace(':','')}00`;$('calendar').href='https://calendar.google.com/calendar/render?'+new URLSearchParams({action:'TEMPLATE',text:c.code+' · '+c.section,dates:stamp(c.start)+'/'+stamp(c.end),ctz:'Asia/Hong_Kong',location:c.room,details:status[c.attendance]+'。依常規課表；請確認假期、停課及實際週次。'});$('course-info').textContent=`課程：${c.code}　組別：${c.section}　CRN：${c.id}。目前未提供課程大綱連結。`;$('detail').showModal();}
function dates(){if(view==='day')return[focus];const mon=add(focus,-((focus.getDay()+6)%7));return Array.from({length:mobile.matches||$('hide-weekends').checked?5:7},(_,i)=>add(mon,i));}
function render(){const ds=dates(); const scale=mobile.matches?.6:1.8; $('today').textContent=view==='week'?'本週':'今天';$('range').textContent=view==='day'?`${md(focus)} · ${names[focus.getDay()]}`:`${md(ds[0])} — ${md(ds.at(-1))}`;$('range-note').textContent=focus.getFullYear()+' · 常規課表';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));$('hide-weekends').disabled=view!=='week';const surface=$('surface');surface.className=view==='day'?'daily':'grid-scroll';surface.replaceChildren();if(view==='day'){const list=courses.filter(c=>c.day===focus.getDay());if(!list.length)surface.innerHTML='<div class="empty">這天沒有排課 ☁<small>留一點時間給自己。</small></div>';list.forEach(c=>{const row=document.createElement('div');row.className='daily-row';row.innerHTML=`<time>${fmt(c.start)}</time>`;row.append(card(c,focus));surface.append(row)});return;}const grid=document.createElement('div');grid.className='grid '+view;grid.style.gridTemplateColumns=mobile.matches?'30px repeat(5,minmax(0,1fr))':'52px '+ds.map(d=>d.getDay()===0||d.getDay()===6?'minmax(82px,.55fr)':'minmax(150px,1fr)').join(' ');grid.append(document.createElement('div'));ds.forEach(d=>{const h=document.createElement('div');h.className='day-head'+(same(d,now)?' today':'')+(d.getDay()%6===0?' weekend':'');h.innerHTML=`${mobile.matches?['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]:names[d.getDay()]} <small>${mobile.matches?d.getDate():(d.getMonth()+1)+'/'+d.getDate()}</small>${same(d,now)?'<b aria-label="今天">●</b>':''}`;grid.append(h)});const times=document.createElement('div');times.className='time-lane';for(let m=480;m<=1140;m+=60){const t=document.createElement('time');t.style.top=((m-480)*scale)+'px';t.textContent=mobile.matches?String(m/60).padStart(2,'0'):fmt(m);times.append(t)}grid.append(times);ds.forEach(d=>{const lane=document.createElement('div');lane.className='day-lane'+(same(d,now)?' today':'')+(d.getDay()%6===0?' weekend':'');courses.filter(c=>c.day===d.getDay()).forEach(c=>lane.append(card(c,d,true)));if(same(d,now)&&mins(now)>=480&&mins(now)<=1140){const line=document.createElement('div');line.className='now-line';line.style.top=((mins(now)-480)*scale)+'px';line.innerHTML='<span>● '+fmt(mins(now))+'</span>';lane.append(line)}grid.append(lane)});surface.append(grid);if(mobile.matches&&!$('hide-weekends').checked){const section=document.createElement('section');section.className='weekend-agenda';section.innerHTML='<h3>週末</h3>';const mon=add(focus,-((focus.getDay()+6)%7));for(const n of [5,6]){const d=add(mon,n),list=courses.filter(c=>c.day===d.getDay());const heading=document.createElement('p');heading.textContent=md(d)+' '+names[d.getDay()]+(list.length?'':' · 沒有排課');section.append(heading);list.forEach(c=>section.append(card(c,d)));}surface.append(section);}}
function tick(){now=hkNow();const m=mins(now),list=courses.filter(c=>c.day===now.getDay()),current=list.find(c=>c.attendance==='required'&&m>=c.start&&m<c.end),conditional=list.find(c=>c.attendance!=='required'&&m>=c.start&&m<c.end);const next=courses.filter(c=>c.attendance==='required').map(c=>{const d=occurrence(c);const dayDiff=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);return{c,d,left:dayDiff*1440+c.start-m}}).sort((a,b)=>a.left-b.left)[0];const c=current||next.c;$('clock').textContent=fmt(m)+(mobile.matches?'':':'+String(now.getSeconds()).padStart(2,'0'));$('date').textContent=md(now)+' '+names[now.getDay()];$('hero-state').textContent=current?'● LIVE · 正在上課':next.left<=15?'即將上課 · 準備出發':list.some(c=>c.attendance==='required'&&c.start>m)?'現在 Free · 稍後有課':'今天沒有剩餘必須出席課 🎉';$('hero-label').textContent=current?'NOW / '+c.kind.toUpperCase():'NEXT / 下一堂必須出席';$('hero-course').textContent=c.code+' · '+c.section;$('hero-room').textContent='⌖ '+c.room;$('hero-time').textContent=`${current?'今天':md(next.d)+' '+names[next.d.getDay()]}　${fmt(c.start)}–${fmt(c.end)}`;$('count-label').textContent=current?'距離下課':'距離上課';$('count').textContent=(mobile.matches&&current?'還有 ':'')+duration(current?c.end-m:next.left)+(mobile.matches?(current?' 下課':'後上課'):'');const pct=current?(m-c.start)/(c.end-c.start)*100:Math.max(0,(1-next.left/180)*100);$('progress').value=pct;$('progress-label').textContent=current?`已完成 ${Math.floor(pct)}%`:'上課前 3 小時倒數進度';$('hero').className='hero '+(current?'live':next.left<=15?'soon':next.left<60?'near':'');$('conditional').textContent=conditional?`${conditional.code} ${conditional.section} 此時段：${status[conditional.attendance]}`:'';const total=list.reduce((a,c)=>a+c.end-c.start,0);$('summary').innerHTML=`<strong>今天 · ${md(now)}</strong><span>${list.length} 堂排課</span><span>${list.filter(c=>c.attendance==='required').length} 堂必須出席</span><span>排課共 ${duration(total)}</span><small>${list.map(c=>`${c.code} ${fmt(c.start)}${c.attendance==='required'?'':c.attendance==='confirm'?'（待確認）':'（按需）'}`).join(' → ')||'沒有排課'}</small>`;const key=now.toDateString()+Math.floor(m);if(key!==last){last=key;render()}}
$('prev').onclick=()=>{focus=add(focus,view==='week'?-7:-1);render()};$('next').onclick=()=>{focus=add(focus,view==='week'?7:1);render()};$('today').onclick=()=>{focus=midnight(hkNow());render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('hide-weekends').onchange=render;$('detail').onclick=e=>{if(e.target===$('detail'))$('detail').close()};tick();setInterval(tick,1000);

$('hide-weekends').checked=mobile.matches; mobile.addEventListener('change',()=>{if(mobile.matches)$('hide-weekends').checked=true;last='';tick();});
let swipeStart=null;const sheet=$('detail');sheet.addEventListener('touchstart',e=>{const t=e.touches[0],r=sheet.getBoundingClientRect();swipeStart=t.clientY-r.top<90?{x:t.clientX,y:t.clientY}:null;},{passive:true});sheet.addEventListener('touchend',e=>{if(swipeStart&&mobile.matches){const t=e.changedTouches[0];if(t.clientY-swipeStart.y>65&&Math.abs(t.clientX-swipeStart.x)<55)sheet.close();}swipeStart=null;},{passive:true});sheet.addEventListener('touchcancel',()=>swipeStart=null);render();
</script></body></html>
