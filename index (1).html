<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#205bc4"><title>我的課表 · Campus Blue</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19395e;background:#eef4fc}*{box-sizing:border-box}body{margin:0}button,a,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}main{max-width:1500px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:1.5px;font-weight:700;color:#557ba5}h1{font-size:32px;margin:8px 0}h1 span{color:#438bec}h2,p{margin:0}.clock{text-align:right;font-size:14px;color:#527193}.clock strong{display:block;font-size:28px;color:#244d80;font-variant-numeric:tabular-nums}.clock small{font-size:12px}.hero{background:#205bc4;color:white;border-radius:26px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;padding:32px 38px;transition:background .4s}.hero.near{background:#514cc3}.hero.soon{background:#4144a6}.hero.live{background:#17669b}.hero .eyebrow{color:#d9eeff}.hero h2{font-size:40px;letter-spacing:-1px;margin:12px 0}.hero p{font-size:16px;line-height:1.7}.hero #hero-label{font-size:12px;letter-spacing:1px;margin-top:23px;color:#d9e9ff}#hero-time{color:#dcecff}.countdown{align-self:center;padding-left:34px;border-left:1px solid #ffffff30}.countdown strong{display:block;font-size:32px;line-height:1.4;margin:10px 0 20px;font-variant-numeric:tabular-nums}.countdown small{font-size:14px}.countdown div{font-size:12px;color:#d9e9ff;margin-top:8px}progress{width:100%;height:7px;appearance:none;border:0;border-radius:10px;overflow:hidden;background:#ffffff30}progress::-webkit-progress-bar{background:#ffffff30}progress::-webkit-progress-value{background:#99e7ff;border-radius:10px}progress::-moz-progress-bar{background:#99e7ff}.conditional:empty{display:none}.conditional{margin-top:15px!im dth:100%;min-width:0}.day-lane .course{position:absolute;overflow:hidden}.course.lab{background:#e4effd;border:1px dashed #89acd6}.course.ta{background:#e9f5f9;border:1px dashed #97b9cb}.course.live{box-shadow:inset 0 0 0 2px #327cd3}.card-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.card-top strong{font-size:19px}.card-time{font-size:13px;font-variant-numeric:tabular-nums}.card-meta{display:flex;gap:8px;align-items:center;font-size:13px}.badge{font-size:10px;letter-spacing:.5px;font-weight:700;border-radius:5px;padding:4px 6px;background:#245fc5;color:white}.badge.lab{background:#f0f6ff;color:#386ca6;border:1px solid #89acd6}.badge.ta{background:#cce4ec;color:#355b71}.attendance{font-size:12px;font-weight:600}.room{font-size:13px;line-height:1.6;overflow-wrap:anywhere}.day-lane .card-top{display:block}.day-lane .card-time{display:block;margin-top:5px}.day-lane .short{padding:6px 9px;gap:3px}.day-lane .short .card-top{display:flex;align-items:center}.day-lane .short .card-top strong{font-size:14px}.day-lane .short .card-time{font-size:10px;margin:0}.day-lane .short .badge{padding:2px 4px}.day-lane .short .card-meta{font-size:11px}.day-lane .short .attendance{font-size:11px}.day-lane .short .room{display:none}.now-line{height:2px;background:#1c7bd3;position:absolute;left:0;right:0;z-index:2;pointer-events:none}.now-line span{position:absolute;right:0;bottom:3px;font-size:11px;background:#195fae;color:white;padding:3px 5px;border-radius:5px}.daily{display:flex;flex-direction:column;gap:20px}.daily-row{display:grid;grid-template-columns:65px 1fr;gap:12px}.daily-row time{padding-top:16px;font-size:14px;color:#5a7799}.daily-row .course{min-height:140px}.empty{text-align:center;padding:65px 10px;background:#f5f8fd;border-radius:16px;font-size:21px;color:#53799e}.empty small{display:block;font-size:14px;margin-top:12px}footer{font-size:12px;color:#647d98;line-height:1.8;padding:20px 4px}dialog{border:0;border-radius:25px;width:calc(100% - 32px);max-width:480px;padding:32px;color:#19395e;box-shadow:0 20px 80px #17376240}dialog::backdrop{background:#14355760}dialog h2{font-size:30px;margin:15px 0 20px}dialog p{margin:12px 0;line-height:1.7;font-size:16px}dialog small{font-size:12px;color:#637f99;line-height:1.7}.close{float:right;border:0;border-radius:50%;background:#edf4fc;color:#466887;font-size:24px;width:40px;height:40px}.info-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #e3edf8;padding:16px 0;font-size:14px}.info-row small{font-size:14px}.notice{background:#eef5fd;border-radius:10px;padding:12px;font-size:14px!important}.detail-actions{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.detail-actions a{background:#245fc5;color:white;text-decoration:none;border-radius:10px;padding:13px;font-size:14px}details{margin:20px 0}summary{cursor:pointer;font-size:14px}button:focus-visible,a:focus-visible{outline:3px solid #4692f0;outline-offset:3px}@media(max-width:760px){main{padding:22px 15px}header{margin-bottom:18px}header .eyebrow{font-size:10px}h1{font-size:28px}.clock{font-size:12px}.clock strong{font-size:23px}.hero{grid-template-columns:1fr;padding:26px;gap:22px}.hero h2{font-size:34px}.countdown{border-left:0;border-top:1px solid #ffffff30;padding:20px 0 0}.countdown strong{font-size:29px;margin:7px 0 12px}.summary{gap:10px 15px;font-size:13px;padding:20px 3px}.summary strong{width:100%;font-size:15px}.summary small{line-height:1.7}.schedule{padding:20px 13px}.toolbar{gap:16px}.toolbar h2{font-size:20px}.controls{width:100%;justify-content:space-between;gap:6px}.controls button{padding:8px 10px;min-height:42px}.subtoolbar{font-size:12px;gap:6px}.daily-row{grid-template-columns:42px 1fr;gap:8px}.daily-row time{font-size:12px}.course{padding:14px;gap:8px}.card-top strong{font-size:21px}.card-top{flex-direction:column;gap:6px}.badge{font-size:11px}.attendance,.room{font-size:13px}.grid.three{min-width:550px}.grid.week{min-width:1030px}dialog{position:fixed;inset:auto 0 0;margin:0;width:100%;max-width:none;max-height:90dvh;border-radius:25px 25px 0 0;padding:22px 24px max(24px,env(safe-area-inset-bottom));animation:slide .2s ease-out}.handle{width:40px;height:4px;background:#c7d8e8;border-radius:4px;margin:0 auto 20px}.info-row{flex-wrap:wrap}dialog h2{font-size:28px}@keyframes slide{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><header><div><span class="eyebrow">CAMPUS BLUE / MY WEEK</span><h1>我的課表<span>.</span></h1></div><div class="clock"><div id="date"></div><strong id="clock"></strong><small>香港時間 HKT</small></div></header>
<section id="hero" class="hero"><div><div id="hero-state" class="eyebrow"></div><p id="hero-label"></p><h2 id="hero-course"></h2><p id="hero-room"></p><p id="hero-time"></p><p id="conditional" class="conditional"></p></div><div class="countdown"><small id="count-label"></small><strong id="count"></strong><progress id="progress" max="100" value="0"></progress><div id="progress-label"></div></div></section>
<section id="summary" class="summary" aria-label="今日摘要"></section>
<section class="schedule"><div class="toolbar"><div><h2 id="range"></h2><small id="range-note"></small></div><div class="controls"><div class="segmented" aria-label="檢視方式"><button data-view="day">Day</button><button data-view="three">3 Days</button><button data-view="week">Week</button></div><div class="nav"><button id="prev" aria-label="前一段日期">‹</button><button id="today">今天</button><button id="next" aria-label="後一段日期">›</button></div></div></div><div class="subtoolbar"><span>● 必須出席　◌ 確認安排　◇ 按需要</span><label><input id="hide-weekends" type="checkbox"> 隱藏週末</label></div><div id="surface"></div></section><footer>依常規每週課表計算；未套用學期起訖、假期及停課。Lab／TA 請確認實際週次。倒數不代表出席紀錄。</footer></main>
<dialog id="detail" aria-labelledby="detail-title"><form method="dialog"><button class="close" aria-label="關閉">×</button></form><div class="handle"></div><span id="detail-kind" class="eyebrow"></span><h2 id="detail-title"></h2><div id="detail-body"></div><div class="detail-actions"><a id="map" target="_blank" rel="noopener">搜尋建築位置 ↗</a><a id="calendar" target="_blank" rel="noopener">加入 Calendar ↗</a></div><details><summary>課程資料</summary><p id="course-info"></p></details><small>日曆僅加入所選日期這一堂，不會建立每週重複課程。</small></dialog><script>const courses=[
{id:'11370',day:1,start:720,end:890,code:'EE3114',section:'L01',kind:'lab',room:'YEUNG P1404、YEUNG G7610、YEUNG B7701'},
{id:'13332',day:1,start:900,end:1070,code:'EE2108',section:'CA1',kind:'lecture',room:'YEUNG B7701'},
{id:'11696',day:2,start:900,end:950,code:'MA2001',section:'TA2',kind:'ta',room:'YEUNG LT-13'},
{id:'10426',day:2,start:1020,end:1130,code:'MA2001',section:'CA1',kind:'lecture',room:'YEUNG LT-1'},
{id:'11369',day:3,start:720,end:890,code:'EE3114',section:'C01',kind:'lecture',room:'YEUNG LT-16'},
{id:'13334',day:4,start:540,end:650,code:'EE2108',section:'LA1',kind:'lab',room:'YEUNG B7701'},
{id:'10030',day:4,start:960,end:1130,code:'EE3210',section:'C01',kind:'lecture',room:'LI 6606'},
{id:'10426',day:5,start:720,end:830,code:'MA2001',section:'CA1',kind:'lecture',room:'BOC R4057'}];
const $=id=>document.getElementById(id), names=['週日','週一','週二','週三','週四','週五','週六'];
const status={lecture:'● 必須出席',lab:'◌ 確認安排',ta:'◇ 按需要'};
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0');
function hkNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Hong_Kong'}));}
const midnight=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);const same=(a,b)=>a.toDateString()===b.toDateString();const md=d=>`${d.getMonth()+1}月${d.getDate()}日`;const mins=d=>d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
function occurrence(c,base=hkNow(),includeCurrent=false){let d=add(base,(c.day-base.getDay()+7)%7);if(same(d,base)&&(includeCurrent?c.end:c.start)<=mins(base))d=add(d,7);return d;}
function duration(n){n=Math.max(0,Math.ceil(n));return (n>=1440?Math.floor(n/1440)+' 天 ':'')+(n%1440>=60?Math.floor(n%1440/60)+' 小時 ':'')+(n%60)+' 分';}
let now=hkNow(),focus=midnight(now),view=matchMedia('(max-width:760px)').matches?'day':'week',last='',opened=null;
function card(c,d,positioned=false){const b=document.createElement('button');const live=same(d,now)&&mins(now)>=c.start&&mins(now)<c.end;b.className='course '+c.kind+(live?' live':'')+(c.end-c.start<60?' short':'');if(positioned){b.style.top=((c.start-480)*1.8)+'px';b.style.height=((c.end-c.start)*1.8-5)+'px';}b.innerHTML=`<div class="card-top"><strong>${c.code}</strong><span class="card-time">${fmt(c.start)}–${fmt(c.end)}</span></div><div class="card-meta"><span class="badge ${c.kind}">${c.kind.toUpperCase()}</span><span>${c.section}</span></div><span class="attendance">${status[c.kind]}${live&&c.kind==='lecture'?' · LIVE':''}</span><span class="room">⌖ ${c.room}</span>`;b.setAttribute('aria-label',`${c.code} ${c.section} ${fmt(c.start)} 至 ${fmt(c.end)} ${status[c.kind]} ${c.room}`);b.onclick=()=>openDetail(c,d);return b;}
function openDetail(c,d){opened={c,d};$('detail-kind').textContent=c.kind.toUpperCase();$('detail-title').textContent=c.code+' · '+c.section;const next=occurrence(c);$('detail-body').innerHTML=`<p>${md(d)} ${names[d.getDay()]} · ${fmt(c.start)}–${fmt(c.end)}</p><p>⌖ ${c.room}</p><div class="info-row"><small>出席安排</small><strong>${status[c.kind]}</strong></div><div class="info-row"><small>下一次常規時段</small><strong>${md(next)} · ${fmt(c.start)}</strong></div>${c.kind!=='lecture'?'<p class="notice">此時段未確認實際上課週次，請先查看課程通知。</p>':''}`;const building=c.room.startsWith('YEUNG')?'Yeung Kin Man Academic Building City University Hong Kong':c.room.startsWith('BOC')?'Bank of China Hong Kong Complex City University Hong Kong':'Li Dak Sum Yip Yio Chin Academic Building City University Hong Kong';$('map').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(building);const stamp=m=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${fmt(m).replace(':','')}00`;$('calendar').href='https://calendar.google.com/calendar/render?'+new URLSearchParams({action:'TEMPLATE',text:c.code+' · '+c.section,dates:stamp(c.start)+'/'+stamp(c.end),ctz:'Asia/Hong_Kong',location:c.room,details:status[c.kind]+'。依常規課表；請確認假期、停課及實際週次。'});$('course-info').textContent=`課程：${c.code}　組別：${c.section}　CRN：${c.id}。目前未提供課程大綱連結。`;$('detail').showModal();}
function dates(){if(view==='day')return[focus];if(view==='three')return[focus,add(focus,1),add(focus,2)];const mon=add(focus,-((focus.getDay()+6)%7));return Array.from({length:$('hide-weekends').checked?5:7},(_,i)=>add(mon,i));}
function render(){const ds=dates();$('range').textContent=view==='day'?`${md(focus)} · ${names[focus.getDay()]}`:`${md(ds[0])} — ${md(ds.at(-1))}`;$('range-note').textContent=focus.getFullYear()+' · 常規課表';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));$('hide-weekends').disabled=view!=='week';const surface=$('surface');surface.className=view==='day'?'daily':'grid-scroll';surface.replaceChildren();if(view==='day'){const list=courses.filter(c=>c.day===focus.getDay());if(!list.length)surface.innerHTML='<div class="empty">這天沒有排課 ☁<small>留一點時間給自己。</small></div>';list.forEach(c=>{const row=document.createElement('div');row.className='daily-row';row.innerHTML=`<time>${fmt(c.start)}</time>`;row.append(card(c,focus));surface.append(row)});return;}const grid=document.createElement('div');grid.className='grid '+view;grid.style.gridTemplateColumns='52px '+ds.map(d=>d.getDay()===0||d.getDay()===6?'minmax(82px,.55fr)':'minmax(150px,1fr)').join(' ');grid.append(document.createElement('div'));ds.forEach(d=>{const h=document.createElement('div');h.className='day-head'+(same(d,now)?' today':'')+(d.getDay()%6===0?' weekend':'');h.innerHTML=`${names[d.getDay()]} <small>${d.getMonth()+1}/${d.getDate()}</small>${same(d,now)?'<b>TODAY</b>':''}`;grid.append(h)});const times=document.createElement('div');times.className='time-lane';for(let m=480;m<=1140;m+=60){const t=document.createElement('time');t.style.top=((m-480)*1.8)+'px';t.textContent=fmt(m);times.append(t)}grid.append(times);ds.forEach(d=>{const lane=document.createElement('div');lane.className='day-lane'+(same(d,now)?' today':'')+(d.getDay()%6===0?' weekend':'');courses.filter(c=>c.day===d.getDay()).forEach(c=>lane.append(card(c,d,true)));if(same(d,now)&&mins(now)>=480&&mins(now)<=1140){const line=document.createElement('div');line.className='now-line';line.style.top=((mins(now)-480)*1.8)+'px';line.innerHTML='<span>● '+fmt(mins(now))+'</span>';lane.append(line)}grid.append(lane)});surface.append(grid);}
function tick(){now=hkNow();const m=mins(now),list=courses.filter(c=>c.day===now.getDay()),current=list.find(c=>c.kind==='lecture'&&m>=c.start&&m<c.end),conditional=list.find(c=>c.kind!=='lecture'&&m>=c.start&&m<c.end);const next=courses.filter(c=>c.kind==='lecture').map(c=>{const d=occurrence(c);const dayDiff=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);return{c,d,left:dayDiff*1440+c.start-m}}).sort((a,b)=>a.left-b.left)[0];const c=current||next.c;$('clock').textContent=fmt(m)+':'+String(now.getSeconds()).padStart(2,'0');$('date').textContent=md(now)+' '+names[now.getDay()];$('hero-state').textContent=current?'● LIVE · 正在上課':next.left<=15?'即將上課 · 準備出發':list.some(c=>c.kind==='lecture'&&c.start>m)?'現在 Free · 稍後有課':'今天沒有剩餘必須出席課 🎉';$('hero-label').textContent=current?'NOW / LECTURE':'NEXT / 下一堂必須出席';$('hero-course').textContent=c.code+' · '+c.section;$('hero-room').textContent='⌖ '+c.room;$('hero-time').textContent=`${current?'今天':md(next.d)+' '+names[next.d.getDay()]}　${fmt(c.start)}–${fmt(c.end)}`;$('count-label').textContent=current?'距離下課':'距離上課';$('count').textContent=duration(current?c.end-m:next.left);const pct=current?(m-c.start)/(c.end-c.start)*100:Math.max(0,(1-next.left/180)*100);$('progress').value=pct;$('progress-label').textContent=current?`已完成 ${Math.floor(pct)}%`:'上課前 3 小時倒數進度';$('hero').className='hero '+(current?'live':next.left<=15?'soon':next.left<60?'near':'');$('conditional').textContent=conditional?`${conditional.code} ${conditional.section} 此時段：${status[conditional.kind]}`:'';const total=list.reduce((a,c)=>a+c.end-c.start,0);$('summary').innerHTML=`<strong>今天 · ${md(now)}</strong><span>${list.length} 堂排課</span><span>${list.filter(c=>c.kind==='lecture').length} 堂必須出席</span><span>排課共 ${duration(total)}</span><small>${list.map(c=>`${c.code} ${fmt(c.start)}${c.kind==='lecture'?'':'（待確認）'}`).join(' → ')||'沒有排課'}</small>`;const key=now.toDateString()+Math.floor(m);if(key!==last){last=key;render()}}
$('prev').onclick=()=>{focus=add(focus,view==='week'?-7:view==='three'?-3:-1);render()};$('next').onclick=()=>{focus=add(focus,view==='week'?7:view==='three'?3:1);render()};$('today').onclick=()=>{focus=midnight(hkNow());render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('hide-weekends').onchange=render;$('detail').onclick=e=>{if(e.target===$('detail'))$('detail').close()};tick();setInterval(tick,1000);
</script></body></html>
